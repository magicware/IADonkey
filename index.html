<!DOCTYPE html>
<html lang="cs" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IADonkey</title>
    <script>
      (function() {
        try {
          var hex = localStorage.getItem('iadonkey_primary_color');
          if (hex && /^#[0-9a-fA-F]{3,6}$/.test(hex)) {
            var fullHex = hex;
            if (fullHex.length === 4) {
              fullHex = '#' + fullHex[1] + fullHex[1] + fullHex[2] + fullHex[2] + fullHex[3] + fullHex[3];
            }
            var r = parseInt(fullHex.slice(1, 3), 16);
            var g = parseInt(fullHex.slice(3, 5), 16);
            var b = parseInt(fullHex.slice(5, 7), 16);
            var rL = Math.min(255, Math.round(r + (255 - r) * 0.25));
            var gL = Math.min(255, Math.round(g + (255 - g) * 0.25));
            var bL = Math.min(255, Math.round(b + (255 - b) * 0.25));
            var hexL = '#' + rL.toString(16).padStart(2, '0') + gL.toString(16).padStart(2, '0') + bL.toString(16).padStart(2, '0');
            var rD = Math.round(r * 0.82);
            var gD = Math.round(g * 0.82);
            var bD = Math.round(b * 0.82);
            var hexD = '#' + rD.toString(16).padStart(2, '0') + gD.toString(16).padStart(2, '0') + bD.toString(16).padStart(2, '0');

            var style = document.createElement('style');
            style.id = 'iadonkey-dynamic-theme';
            style.textContent = `
              .bg-indigo-600 { background-color: ${fullHex} !important; }
              .hover\\:bg-indigo-500:hover, .hover\\:bg-indigo-600:hover { background-color: ${hexL} !important; }
              .active\\:bg-indigo-700:active { background-color: ${hexD} !important; }
              .text-indigo-400, .text-indigo-300, .text-indigo-200 { color: ${hexL} !important; }
              .border-indigo-500, .border-indigo-400 { border-color: ${fullHex} !important; }
              .border-t-indigo-500, .border-t-indigo-400 { border-top-color: ${fullHex} !important; }
              .focus\\:border-indigo-500:focus, .focus-within\\:border-indigo-500:focus-within { border-color: ${fullHex} !important; }
              .bg-indigo-600\\/30 { background-color: rgba(${r}, ${g}, ${b}, 0.28) !important; }
              .border-indigo-500\\/40 { border-color: rgba(${r}, ${g}, ${b}, 0.5) !important; }
              .bg-indigo-500\\/20 { background-color: rgba(${r}, ${g}, ${b}, 0.2) !important; }
              .hover\\:bg-indigo-500\\/35:hover { background-color: rgba(${r}, ${g}, ${b}, 0.35) !important; }
              .border-indigo-500\\/30, .border-indigo-500\\/20 { border-color: rgba(${r}, ${g}, ${b}, 0.35) !important; }
              .bg-indigo-950\\/40 { background-color: rgba(${r}, ${g}, ${b}, 0.18) !important; }
              .hover\\:bg-indigo-900\\/40:hover { background-color: rgba(${r}, ${g}, ${b}, 0.28) !important; }
              .from-indigo-500 { --tw-gradient-from: ${fullHex} var(--tw-gradient-from-position) !important; }
              .shadow-indigo-600\\/30, .shadow-indigo-600\\/20, .shadow-indigo-500\\/20 { --tw-shadow-color: rgba(${r}, ${g}, ${b}, 0.35) !important; }
              .ring-indigo-500\\/50 { --tw-ring-color: rgba(${r}, ${g}, ${b}, 0.5) !important; }
            `;
            document.head.appendChild(style);
          }
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
      /* Ensure scrollbars look slick */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
      }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="bg-transparent text-gray-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
